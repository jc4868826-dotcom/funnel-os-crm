<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RMG Parts</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#07090c;color:#fff}
header{background:#000;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
nav a{color:#fff;text-decoration:none;margin:0 14px}
.hero img{width:100%;display:block}
.search{max-width:1100px;margin:-35px auto 50px;background:#111;padding:25px;border-radius:14px;box-shadow:0 15px 40px rgba(0,0,0,.5)}
.search input{width:78%;padding:16px;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
.search button{padding:16px 28px;background:#0b7fe0;color:#fff;border:none;border-radius:8px}
.chips{margin-top:18px}
.chips span{display:inline-block;background:#1a1d22;padding:8px 15px;border-radius:40px;margin:5px}
section{max-width:1200px;margin:auto;padding:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px}
footer{background:#000;padding:40px;text-align:center;color:#aaa;margin-top:40px}
</style>
</head>
<body>
<header>
<h2>RMG PARTS</h2>
<nav>
<a href="#">Productos</a>
<a href="#">Marcas</a>
<a href="#">Empresas</a>
<a href="#">Contacto</a>
</nav>
</header>

<section class="hero">
<img src="rmg_brand_hero.png" alt="Hero">
</section>

<div class="search">
<input placeholder="Buscar por código, medida o producto...">
<button>Buscar</button>
<div class="chips">
<span>Neumáticos</span>
<span>Baterías</span>
<span>Aceites</span>
<span>Grasas</span>
<span>Refrigerantes</span>
<span>Aditivos</span>
</div>
</div>

<section>
<h2>Categorías</h2>
<div class="grid">
<div class="card"><h3>Neumáticos</h3><p>Autos y maquinaria.</p></div>
<div class="card"><h3>Baterías</h3><p>Autos y tractores.</p></div>
<div class="card"><h3>Aceites</h3><p>Bidón y tambor.</p></div>
<div class="card"><h3>Lubricantes</h3><p>Productos premium.</p></div>
</div>
</section>

<footer>© RMG Parts</footer>
</body>
</html>
